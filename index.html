<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MUERTOMETRO">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>MUERTOMETRO</title>
</head>
<body>
  <main class="app" aria-label="Muertometro">
    <header class="topbar">
      <h1>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="Pantalla completa" title="Pantalla completa">
          <img class="header-logo" src="assets/banner-header.png" alt="Muertómetro">
        </button>
      </h1>
    </header>

    <details class="enemy-form-accordion" id="enemyFormAccordion">
      <summary class="enemy-form-toggle" id="enemyFormToggle">
        <span class="enemy-form-toggle__text">Enemigos</span>
      </summary>
      <div class="enemy-form-panel">
        <form class="enemy-form" id="enemyForm" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <div class="monster-search">
            <input id="nameInput" name="enemy-name" type="text" placeholder="Enemigo" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" enterkeyhint="next" data-form-type="other" data-lpignore="true" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="monsterSuggestions">
            <div class="monster-suggestions" id="monsterSuggestions" role="listbox"></div>
          </div>
          <select id="levelInput" name="scenario-level" autocomplete="new-password" aria-label="Nivel">
            <option value="0">Nivel 0</option>
            <option value="1">Nivel 1</option>
            <option value="2">Nivel 2</option>
            <option value="3">Nivel 3</option>
            <option value="4">Nivel 4</option>
            <option value="5">Nivel 5</option>
            <option value="6">Nivel 6</option>
            <option value="7">Nivel 7</option>
          </select>
          <input id="healthInput" name="enemy-health" type="number" min="1" step="1" inputmode="numeric" placeholder="Vida" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
          <input id="shieldInput" name="enemy-shield" type="number" min="0" step="1" inputmode="numeric" placeholder="Escudo" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
          <input id="quantityInput" name="enemy-quantity" type="number" min="1" max="99" step="1" inputmode="numeric" placeholder="Nº" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="add-button" type="submit">Añadir enemigo</button>
        </form>
      </div>
    </details>

    <section class="enemy-list" id="enemyList" aria-live="polite"></section>
  </main>

  <div class="undo-snackbar" id="undoSnackbar" role="status" aria-live="polite" aria-atomic="true">
    <span class="undo-snackbar__message" id="undoSnackbarMessage"></span>
    <button class="undo-snackbar__action" id="undoSnackbarUndo" type="button">Deshacer</button>
  </div>

  <template id="enemyTemplate">
    <article class="enemy" tabindex="0" role="button" aria-expanded="false">
      <div class="enemy-top">
        <button class="enemy-ordinal enemy-ordinal-toggle" type="button" aria-pressed="false" aria-label="Marcar como élite" title="Marcar como élite">①</button>
        <span class="stat health-stat"><img class="stat-icon" src="assets/icons/heal.svg" alt="" aria-hidden="true"> <span class="health-value"></span></span>
        <div class="monster-attributes" aria-hidden="true"></div>
        <span class="stat shield-stat"><img class="stat-icon" src="assets/icons/shield.svg" alt="" aria-hidden="true"> <span class="shield-value"></span></span>
      </div>

      <div class="enemy-body" hidden>
        <div class="enemy-body-inner">
          <div class="quick-actions" aria-label="Acciones rápidas">
            <button type="button" data-damage="1">-1</button>
            <button type="button" data-damage="2">-2</button>
            <button type="button" data-damage="3">-3</button>
            <button type="button" data-damage="5">-5</button>
            <button class="damage-build-indicator" type="button" hidden aria-label="Resolver golpe acumulado"></button>
            <button class="heal-button" type="button" aria-label="Curar 1">+1</button>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
